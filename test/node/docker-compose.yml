version: '3.8'

services:

  soc:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
      - TZ=Asia/Seoul
    command: python soc_250429pine2.py

  nodemqtt:
    build: .
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
      - TZ=Asia/Seoul      
    command: python nodemqtt_2.py


networks:
  daa-kafka-cluster-network:
    driver: bridge    
