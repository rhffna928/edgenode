version: '3.8'

services:

  soc:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
    command: python soc_250429pine.py

  mobile:
    build: .
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
    command: python mobile.py

  nodemqtt:
    build: .
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
    command: python nodemqtt_2.py

  vehi:
    build: .
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
    command: python vehicle(4.21).py 
  trac:
    build: .
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
    command: python trac.py 

networks:
  daa-kafka-cluster-network:
    driver: bridge    
