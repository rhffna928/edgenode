version: '3.8'

services:

  soc:
    build: .
    ports:
      - "6000:6000"
    volumes:
      - ./logs:/app/logs
      - ./sqlite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network      
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
      - TZ=Asia/Seoul
    command: python soc_250429pine.py

networks:
  daa-kafka-cluster-network:
    driver: bridge    

version: '3.8'

services:

  socket:
    build: .
    ports: 6000:6000
    volumes:
      - ./logs:/app/logs
      - ./splite_db:/app/sqlite_db
    networks:
      - daa-kafka-cluster-network
    environment:
      - KAFKA_BROKER=daa-kafka1:19092
      - ZOOKEEPER_CONNECT=daa-zoo1:2888
      - TZ=Asia/Seoul
    command: python soc_250429pine.py